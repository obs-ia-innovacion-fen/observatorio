name: Recolección semanal

# Corre los lunes a las 11:17 UTC (07:17 u 08:17 en Chile segun horario de verano)
# y tambien a mano desde la pestaña Actions del repositorio. El minuto 17 evita el
# inicio de la hora, cuando GitHub posterga o descarta corridas programadas.
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    # Version fija: ubuntu-latest pasa a Ubuntu 26.04 desde el 19 de octubre de 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recolectar literatura academica
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/recolectar.py

      - name: Recolectar medios
        run: python scripts/medios.py
        continue-on-error: true

      - name: Generar resumen de la bandeja
        run: python scripts/resumen.py

      - name: Guardar la bandeja en el repositorio
        run: |
          git config user.name "Recolector del Observatorio"
          git config user.email "actions@github.com"
          git add fuentes/bandeja
          if git diff --staged --quiet; then
            echo "Sin novedades esta semana."
            exit 0
          fi
          git commit -m "Bandeja del $(date +%Y-%m-%d)"
          # GitHub a veces rechaza el push con un error interno. Se reintenta
          # hasta 5 veces, trayendo antes lo que haya llegado a main.
          for intento in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "::error::La bandeja choca con archivos que ya estan en main. Lanza la recoleccion con Run workflow en vez de Re-run."
              exit 1
            fi
            if [ "$intento" -lt 5 ]; then
              echo "::warning::No se pudo guardar la bandeja (intento $intento de 5). Nuevo intento en $((intento * 15)) s."
              sleep $((intento * 15))
            fi
          done
          echo "::error::No se pudo guardar la bandeja despues de 5 intentos."
          exit 1
