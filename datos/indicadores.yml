# --- PENDIENTES ---
# Completar con cifra, anio y enlace exacto antes de publicarlas.
#
# Stanford AI Index 2026 (HAI) — informe y datos publicos:
#   Informe: https://hai.stanford.edu/ai-index/2026-ai-index-report
#   PDF:     https://hai.stanford.edu/assets/files/ai_index_report_2026.pdf
#   Datos:   https://drive.google.com/drive/folders/1zJTOg0iR0j5SijCwFutwWvDt143lW277
#   Capitulos utiles para el Observatorio: Economy (cap. 4) y Policy and
#   Governance (cap. 8). Extraer inversion privada, adopcion empresarial y
#   marcos regulatorios para los tres paises.
#
# Encuestas nacionales de innovacion — la capa que nadie compara:
#   Brasil  PINTEC (IBGE)         proporcion de empresas innovadoras
#   Argentina ENDEI               gasto en innovacion sobre ventas
#   Chile   Encuesta Nacional de Innovacion (MinEcon)
#   Comparar exige nota metodologica: los instrumentos no son identicos.
#
# OCDE — la unica de las fuentes con datos consultables por API, asi que es la
#   que puede alimentar graficos de forma automatica.
#   MSTI (Main Science and Technology Indicators): gasto en I+D sobre PIB,
#     investigadores por cada mil ocupados, financiamiento publico y privado.
#   OECD.AI Policy Observatory: politicas de IA, inversion, talento.
#   SME and Entrepreneurship Outlook: adopcion tecnologica en empresas de
#     menor tamano, que es justo el foco del Observatorio.
#   Portal: https://data-explorer.oecd.org  ·  https://oecd.ai
#
#   ADVERTENCIA DE COBERTURA: Chile es miembro de la OCDE, Brasil esta en
#   proceso de adhesion y Argentina no es miembro. La disponibilidad de datos
#   difiere entre los tres. Cuando un pais no tenga dato, decirlo
#   explicitamente en la nota de la serie: un vacio sin explicar se lee como
#   un cero y falsea la comparacion.
#
# Data Chile (datachile.io) y datos.gob.cl: informacion de Corfo y de programas
#   publicos chilenos de fomento. Primera fuente propiamente nacional de la
#   seccion; verificar que el portal siga activo antes de citarlo.
#
# Global Innovation Index (WIPO): posicion de los tres paises.
# RICYT: indicadores de ciencia y tecnologia iberoamericanos. Cubre a los tres
#   con el mismo instrumento, lo que lo hace mejor para comparar entre ellos
#   aunque tenga menos visibilidad internacional.
