# Indicadores del Observatorio.
#
# REGLA: ninguna cifra sin fuente, anio y enlace. Sin esos tres campos no se
# publica. "verificado" es la fecha en que alguien confirmo el dato en la
# fuente: el sitio marca en amarillo lo que lleva mas de un anio sin verificar.
#
# "tema" agrupa la cifra: 'ia' o 'innovacion'. Define en que panel aparece.
#
# Si la cifra sale de un informe largo, el campo "pagina" es obligatorio: es lo
# que permite comprobarla en treinta segundos en vez de releer el documento.
# Una cifra extraida automaticamente entra con verificado en blanco hasta que
# una persona la confirme.
#
# Cifras heredadas del sitio anterior del Observatorio (dirigido por David
# Diaz), atribuidas al ILIA. Reverificar contra el informe antes de publicar.

# Lectura de la edicion: que muestran los indicadores este anio, en palabras
# propias. Tres o cuatro lineas, no un resumen de las cifras: la interpretacion
# es lo que aporta el Observatorio y lo que un panel de numeros no da solo.
# Se reescribe cuando entra una edicion nueva de las fuentes.

