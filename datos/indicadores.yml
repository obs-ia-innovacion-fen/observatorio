# --- SERIES COMPARADAS ---
# Para datos dinamicos: una serie por indicador, con un valor por pais y anio.
# El sitio dibuja el grafico solo, sin librerias externas.
#
# De donde salen: el AI Index publica sus datos para reutilizacion en
# https://drive.google.com/drive/folders/1zJTOg0iR0j5SijCwFutwWvDt143lW277
# Se descarga el archivo del capitulo que interese, se filtran las filas de
# Chile, Brasil y Argentina, y se copian aqui. No se reproducen los graficos
# del informe: son obra suya. Los datos se usan citando la fuente.
#
# Herramienta interactiva de comparacion entre paises:
# https://hai.stanford.edu/ai-index/global-vibrancy-tool

