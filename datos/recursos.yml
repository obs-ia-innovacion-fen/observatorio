# Recursos del Observatorio: formacion y aprendizaje.
#
# Tres bloques. Los playgrounds son de David Diaz y viven en su portal
# (ml-ai-portal.vercel.app): aqui solo se enlazan, no se copia su codigo.
# Los programas son los que Unegocios asocia al Observatorio en su pagina
# oficial; "direccion" replica lo que declara esa pagina y se corrige alli
# primero. Un programa sin enlace no se publica.

portal:
  titulo: "Playgrounds interactivos de machine learning"
  descripcion: >
    Nueve micro-sitios para explorar técnicas de machine learning ajustando
    parámetros y viendo el resultado en el momento. Corren en el navegador,
    sin instalar nada ni crear cuenta. Los construyó David Díaz como material
    de sus cursos de machine learning, IA y business intelligence.
  autor: "David Díaz"
  url: "https://ml-ai-portal.vercel.app"
  texto_enlace: "Ir al portal de aprendizaje"

playgrounds:
  - familia: "Marco y ciclo de vida"
    titulo: "Panorama del ML (CRISP-DM)"
    detalle: "Las fases del ciclo de modelamiento analítico, la madurez de los modelos y un laboratorio para ubicar cada técnica en un marco común."
    temas: ["CRISP-DM", "Ciclo de vida"]
    url: "https://ml-landscape-playground.vercel.app"
  - familia: "Aprendizaje no supervisado"
    titulo: "Clustering"
    detalle: "K-Means, DBSCAN y clustering jerárquico: cómo cambian las particiones al mover centroides, epsilon y criterio de enlace."
    temas: ["K-Means", "DBSCAN", "Jerárquico"]
    url: "https://clustering-playground.vercel.app"
  - familia: "Aprendizaje no supervisado"
    titulo: "Análisis de componentes principales"
    detalle: "Reducción de dimensionalidad: varianza explicada, reconstrucción con menos componentes y detección de anomalías."
    temas: ["PCA", "SVD", "Anomalías"]
    url: "https://pca-playground.vercel.app"
  - familia: "Aprendizaje no supervisado"
    titulo: "Autoencoders"
    detalle: "Entrenar un autoencoder en el navegador, ver cómo se forman los embeddings en el espacio latente y usar el error de reconstrucción para detectar anomalías."
    temas: ["Autoencoder", "Embeddings", "Espacio latente"]
    url: "https://autoencoder-embedding-playground.vercel.app"
  - familia: "Reglas de asociación"
    titulo: "Reglas de asociación"
    detalle: "Análisis de canasta de mercado con Apriori y FP-Growth: conjuntos frecuentes, soporte, confianza y lift."
    temas: ["Apriori", "FP-Growth", "Soporte / confianza / lift"]
    url: "https://association-rules-playground.vercel.app"
  - familia: "Aprendizaje supervisado"
    titulo: "Regresión supervisada"
    detalle: "Ajustar rectas a mano, ver la solución analítica de mínimos cuadrados, extender a polinomios y controlar la complejidad con Ridge y Lasso."
    temas: ["Regresión lineal", "Polinomial", "Ridge / Lasso"]
    url: "https://linear-models-playground.vercel.app"
  - familia: "Aprendizaje supervisado"
    titulo: "Árboles y ensambles"
    detalle: "De un árbol de decisión a Random Forest y Gradient Boosting: profundidad, importancia de variables y el compromiso sesgo-varianza."
    temas: ["Árbol de decisión", "Random Forest", "Gradient Boosting"]
    url: "https://tree-ensemble-playground.vercel.app"
  - familia: "Aprendizaje supervisado"
    titulo: "Kernels y redes neuronales"
    detalle: "Métricas de distancia en KNN, márgenes de SVM, la regla de aprendizaje del perceptrón y la arquitectura de un perceptrón multicapa."
    temas: ["KNN", "SVM", "Perceptrón", "MLP"]
    url: "https://kernel-neural-playground.vercel.app"
  - familia: "Evaluación de modelos"
    titulo: "Evaluación"
    detalle: "Matriz de confusión, curvas ROC, precisión-recall, análisis de umbral y desbalance de clases con SMOTE."
    temas: ["ROC / AUC", "Matriz de confusión", "SMOTE"]
    url: "https://evaluation-playground-psi.vercel.app"

